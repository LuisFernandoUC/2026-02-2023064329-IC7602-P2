{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "zonal-cache.secretName" . }}
  labels:
    {{- include "zonal-cache.labels" . | nindent 4 }}
type: Opaque
stringData:
  config-token: {{ .Values.secrets.configToken | quote }}
  session-secret: {{ .Values.secrets.sessionSecret | quote }}
{{- end }}
{{- if and .Values.tls.enabled (not .Values.tls.existingSecret) }}
{{- $cert := genSelfSignedCert .Values.tls.commonName nil .Values.tls.altNames 365 }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "zonal-cache.tlsSecretName" . }}
  labels:
    {{- include "zonal-cache.labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  tls.crt: {{ $cert.Cert | b64enc }}
  tls.key: {{ $cert.Key | b64enc }}
{{- end }}
