{{- range .Values.zones }}
{{- $zone := dict "root" $ "zone" .name }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "zonal-cache.zoneName" $zone }}
  labels:
    {{- include "zonal-cache.labels" $ | nindent 4 }}
    zonal-cache/zone: {{ .name }}
spec:
  type: {{ $.Values.service.type }}
  {{- if .clusterIP }}
  clusterIP: {{ .clusterIP }}
  {{- end }}
  selector:
    app.kubernetes.io/instance: {{ $.Release.Name }}
    zonal-cache/zone: {{ .name }}
  ports:
    - name: http
      port: {{ $.Values.service.httpPort }}
      targetPort: http
      {{- if and .nodePortHttp (ne $.Values.service.type "ClusterIP") }}
      nodePort: {{ .nodePortHttp }}
      {{- end }}
    {{- if $.Values.tls.enabled }}
    - name: https
      port: {{ $.Values.service.httpsPort }}
      targetPort: https
      {{- if and .nodePortHttps (ne $.Values.service.type "ClusterIP") }}
      nodePort: {{ .nodePortHttps }}
      {{- end }}
    {{- end }}
{{- end }}
