# Valores por defecto del chart apache.

image:
  repository: apache-p2
  tag: latest
  # En Docker Desktop/minikube/kind con imágenes locales usar IfNotPresent o Never.
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  # ClusterIP | NodePort | LoadBalancer
  type: ClusterIP
  port: 80

# Puerto interno del contenedor.
containerPort: 80

resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 250m
    memory: 256Mi
