apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dns-interceptor.fullname" . }}
  labels:
    {{- include "dns-interceptor.labels" . | nindent 4 }}
data:
  DI_PORT: {{ .Values.containerPort | quote }}
  DI_DOMAINS: {{ join "," .Values.domains | quote }}
  DI_ZONE_IPS: {{ include "dns-interceptor.zoneIPs" . | quote }}
  DI_DEFAULT_ZONE: {{ .Values.defaultZone | quote }}
  DI_UPSTREAM_DNS: {{ .Values.upstream.dns | quote }}
  DI_UPSTREAM_TIMEOUT_MS: {{ .Values.upstream.timeoutMs | quote }}
  DI_TTL: {{ .Values.ttl | quote }}
  DI_TCP: {{ ternary "1" "0" .Values.tcp.enabled | quote }}
  DI_HEALTH_PORT: {{ .Values.health.port | quote }}
  DI_HEALTH_INTERVAL_SECONDS: {{ .Values.health.intervalSeconds | quote }}
  DI_HEALTH_TIMEOUT_MS: {{ .Values.health.timeoutMs | quote }}
  {{- if .Values.domainsSync.url }}
  DI_DOMAINS_URL: {{ .Values.domainsSync.url | quote }}
  DI_DOMAINS_REFRESH_SECONDS: {{ .Values.domainsSync.refreshSeconds | quote }}
  {{- end }}
