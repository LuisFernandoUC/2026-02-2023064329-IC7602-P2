{{- if and .Values.domainsSync.url .Values.domainsSync.token (not .Values.domainsSync.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dns-interceptor.fullname" . }}
  labels:
    {{- include "dns-interceptor.labels" . | nindent 4 }}
type: Opaque
stringData:
  domains-token: {{ .Values.domainsSync.token | quote }}
{{- end }}
