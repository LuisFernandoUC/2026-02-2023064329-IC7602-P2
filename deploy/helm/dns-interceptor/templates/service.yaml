apiVersion: v1
kind: Service
metadata:
  name: {{ include "dns-interceptor.fullname" . }}
  labels:
    {{- include "dns-interceptor.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/name: {{ include "dns-interceptor.name" . }}
  ports:
    - name: dns
      protocol: UDP
      port: {{ .Values.service.port }}
      targetPort: dns
      {{- if and .Values.service.nodePort (eq .Values.service.type "NodePort") }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
