# Valores por defecto del chart rest-api-java.

image:
  repository: rest-api-java
  tag: latest
  # En Docker Desktop/minikube/kind con imágenes locales usar IfNotPresent o Never.
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  # ClusterIP | NodePort | LoadBalancer
  type: ClusterIP
  port: 8080

# Puerto interno del contenedor.
containerPort: 8080

resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 250m
    memory: 256Mi
