# Servidores de origen del Proyecto 2: Apache y Rest API Java.
# Uso: docker compose -f deploy/docker-compose.yml up --build
services:
  apache:
    build: ../apache
    ports:
      - "${APACHE_PORT:-8081}:80"
    restart: unless-stopped

  rest-api-java:
    build: ../rest-api-java
    environment:
      PORT: ${REST_API_PORT:-8080}
    ports:
      - "${REST_API_PORT:-8080}:${REST_API_PORT:-8080}"
    restart: unless-stopped
