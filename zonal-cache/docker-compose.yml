# Entorno local de desarrollo de la Zonal Cache (sin Kubernetes ni API Node.js).
#
#   docker compose -f zonal-cache/docker-compose.yml up --build
#
# Levanta:
#   - certs:        genera un certificado autofirmado para la SSL termination.
#   - origin:       Apache httpd con una página de ejemplo (servidor de origen).
#   - zonal-cache:  la caché en http://localhost:8080 y https://localhost:8443,
#                   configurada con dev/config.json en lugar del API Node.js.
services:
  certs:
    image: alpine:3.20
    command: >
      sh -c "apk add --no-cache openssl >/dev/null &&
             [ -f /certs/tls.crt ] ||
             (openssl req -x509 -newkey rsa:2048 -nodes -days 365
               -subj '/CN=zonal-cache.local'
               -keyout /certs/tls.key -out /certs/tls.crt &&
              chmod 644 /certs/tls.key /certs/tls.crt)"
    volumes:
      - ./dev/certs:/certs

  origin:
    image: httpd:2.4
    volumes:
      - ./dev/html:/usr/local/apache2/htdocs:ro

  zonal-cache:
    build: .
    depends_on:
      certs:
        condition: service_completed_successfully
      origin:
        condition: service_started
    ports:
      - "8080:8080"
      - "8443:8443"
    environment:
      ZC_ZONE: local
      ZC_HTTP_PORT: "8080"
      ZC_HTTPS_PORT: "8443"
      ZC_TLS_CERT_FILE: /certs/tls.crt
      ZC_TLS_KEY_FILE: /certs/tls.key
      ZC_CONFIG_FILE: /config/config.json
      ZC_CONFIG_REFRESH_SECONDS: "10"
      ZC_LOGIN_URL: ${ZC_LOGIN_URL:-http://localhost:5173/login}
      ZC_SESSION_SECRET: ${ZC_SESSION_SECRET:-secreto-solo-para-desarrollo}
      ZC_LOG_LEVEL: debug
    volumes:
      - ./dev/certs:/certs:ro
      - ./dev/config.json:/config/config.json:ro
