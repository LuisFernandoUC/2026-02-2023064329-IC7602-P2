<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" width="700" height="380" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#444"/></marker>
  </defs>
  <rect width="700" height="380" fill="#fff"/>
  <text x="350" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Login de un recurso con usuario y contraseña</text>

  <!-- Lifelines -->
  <g stroke="#bbb" stroke-dasharray="4 4">
    <line x1="90" y1="76" x2="90" y2="370"/>
    <line x1="260" y1="76" x2="260" y2="370"/>
    <line x1="430" y1="76" x2="430" y2="370"/>
    <line x1="600" y1="76" x2="600" y2="370"/>
  </g>

  <rect x="35" y="40" width="110" height="36" rx="8" fill="#fff3d6" stroke="#c98f00"/>
  <text x="90" y="63" text-anchor="middle" font-weight="bold">Navegador</text>
  <rect x="205" y="40" width="110" height="36" rx="8" fill="#e6f0ff" stroke="#3b6fd4"/>
  <text x="260" y="63" text-anchor="middle" font-weight="bold">Zonal Cache</text>
  <rect x="375" y="40" width="110" height="36" rx="8" fill="#f1e8ff" stroke="#7a4fd0"/>
  <text x="430" y="63" text-anchor="middle" font-weight="bold">UI</text>
  <rect x="545" y="40" width="110" height="36" rx="8" fill="#f1e8ff" stroke="#7a4fd0"/>
  <text x="600" y="63" text-anchor="middle" font-weight="bold">API Node.js</text>

  <g stroke="#444" fill="none">
    <path d="M90,112 L260,112" marker-end="url(#a)"/>
    <path d="M260,152 L90,152" stroke-dasharray="4 3" marker-end="url(#a)"/>
    <path d="M90,192 L430,192" marker-end="url(#a)"/>
    <path d="M430,232 L600,232" marker-end="url(#a)"/>
    <path d="M600,262 L430,262" stroke-dasharray="4 3" marker-end="url(#a)"/>
    <path d="M430,292 L90,292" stroke-dasharray="4 3" marker-end="url(#a)"/>
    <path d="M90,322 L260,322" marker-end="url(#a)"/>
    <path d="M260,356 L90,356" stroke-dasharray="4 3" marker-end="url(#a)"/>
  </g>

  <g font-size="11" fill="#333" text-anchor="middle">
    <text x="175" y="105">1 · GET /privado (sin sesión)</text>
    <text x="175" y="145">2 · 302 al formulario de la UI</text>
    <text x="260" y="185">3 · usuario y contraseña</text>
    <text x="515" y="225">4 · POST /api/cache/sessions</text>
    <text x="515" y="255">5 · JWT firmado</text>
    <text x="260" y="285">6 · redirige a la caché con el token</text>
    <text x="175" y="315">7 · /__zc/auth?token=JWT</text>
    <text x="175" y="349">8 · 302 + cookie zc_session</text>
  </g>
</svg>
