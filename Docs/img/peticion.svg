<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" width="720" height="290" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#444"/></marker>
  </defs>
  <rect width="720" height="290" fill="#fff"/>
  <text x="360" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Recorrido de una petición</text>

  <rect x="20" y="40" width="110" height="50" rx="8" fill="#fff3d6" stroke="#c98f00"/>
  <text x="75" y="70" text-anchor="middle">Cliente</text>

  <rect x="300" y="40" width="150" height="50" rx="8" fill="#e6f0ff" stroke="#3b6fd4"/>
  <text x="375" y="70" text-anchor="middle" font-weight="bold">DNS Interceptor</text>

  <rect x="300" y="160" width="150" height="50" rx="8" fill="#e6f0ff" stroke="#3b6fd4"/>
  <text x="375" y="190" text-anchor="middle" font-weight="bold">Zonal Cache</text>

  <rect x="540" y="160" width="150" height="50" rx="8" fill="#e8f7ea" stroke="#2f8f46"/>
  <text x="615" y="190" text-anchor="middle" font-weight="bold">Origen</text>

  <path d="M130,55 L300,55" stroke="#444" fill="none" marker-end="url(#a)"/>
  <text x="215" y="48" text-anchor="middle" font-size="12" fill="#333">1 · ¿IP del dominio?</text>
  <path d="M300,76 L130,76" stroke="#444" fill="none" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <text x="215" y="94" text-anchor="middle" font-size="12" fill="#333">2 · IP de la caché de su país</text>

  <path d="M75,90 L75,185 L300,185" stroke="#444" fill="none" marker-end="url(#a)"/>
  <text x="90" y="178" font-size="12" fill="#333">3 · GET (encabezado Host)</text>

  <path d="M450,185 L540,185" stroke="#444" fill="none" marker-end="url(#a)"/>
  <text x="495" y="178" text-anchor="middle" font-size="12" fill="#333">4 · MISS</text>

  <rect x="20" y="236" width="680" height="40" rx="8" fill="#f6f8fb" stroke="#cfd6df"/>
  <text x="34" y="252" font-size="12" fill="#333"><tspan font-weight="bold">HIT:</tspan> está en disco y no venció → responde sin ir al origen (X-Cache: HIT)</text>
  <text x="34" y="268" font-size="12" fill="#333"><tspan font-weight="bold">MISS:</tspan> pide al origen, guarda con su TTL y responde (X-Cache: MISS)</text>
</svg>
