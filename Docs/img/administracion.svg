<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" width="720" height="290" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#444"/></marker>
  </defs>
  <rect width="720" height="280" fill="#fff"/>
  <text x="360" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Administración y configuración</text>

  <rect x="20" y="50" width="110" height="50" rx="8" fill="#fff3d6" stroke="#c98f00"/>
  <text x="75" y="80" text-anchor="middle">Administrador</text>

  <rect x="180" y="50" width="110" height="50" rx="8" fill="#f1e8ff" stroke="#7a4fd0"/>
  <text x="235" y="80" text-anchor="middle" font-weight="bold">UI</text>

  <rect x="340" y="50" width="130" height="50" rx="8" fill="#f1e8ff" stroke="#7a4fd0"/>
  <text x="405" y="80" text-anchor="middle" font-weight="bold">API Node.js</text>

  <rect x="530" y="50" width="130" height="50" rx="8" fill="#f1e8ff" stroke="#7a4fd0"/>
  <text x="595" y="80" text-anchor="middle" font-weight="bold">Firestore</text>

  <rect x="280" y="170" width="140" height="46" rx="8" fill="#e6f0ff" stroke="#3b6fd4"/>
  <text x="350" y="198" text-anchor="middle" font-weight="bold">Zonal Cache</text>

  <rect x="450" y="170" width="150" height="46" rx="8" fill="#e6f0ff" stroke="#3b6fd4"/>
  <text x="525" y="198" text-anchor="middle" font-weight="bold">DNS Interceptor</text>

  <g stroke="#444" fill="none">
    <path d="M130,75 L180,75" marker-end="url(#a)"/>
    <path d="M290,75 L340,75" marker-end="url(#a)"/>
    <path d="M470,75 L530,75" marker-end="url(#a)"/>
    <path d="M370,170 L370,100" stroke-dasharray="4 3" marker-end="url(#a)"/>
    <path d="M510,170 L440,100" stroke-dasharray="4 3" marker-end="url(#a)"/>
  </g>

  <g font-size="11" fill="#333">
    <text x="155" y="68" text-anchor="middle">1</text>
    <text x="315" y="68" text-anchor="middle">2</text>
    <text x="500" y="68" text-anchor="middle">3</text>
    <text x="378" y="140">4 · cada 30 s</text>
    <text x="488" y="130">4 · cada 30 s</text>
  </g>

  <rect x="20" y="232" width="680" height="44" rx="8" fill="#f6f8fb" stroke="#cfd6df"/>
  <text x="34" y="250" font-size="12" fill="#333">1 · El administrador registra dominio, reglas, claves y usuarios   2 · La UI llama al API con su sesión de Firebase</text>
  <text x="34" y="267" font-size="12" fill="#333">3 · El API guarda en Firestore (un registro TXT verifica el dominio)   4 · Caché y DNS piden la configuración</text>
</svg>
