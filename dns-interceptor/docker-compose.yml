# Entorno de desarrollo del DNS Interceptor (sin Kubernetes).
# Uso: docker compose up --build
# Prueba: dig @127.0.0.1 -p 15353 apache.p2.local +subnet=80.58.61.0/24  (el 5353 del equipo lo usa mDNS)
#         dig @127.0.0.1 -p 15353 +tcp apache.p2.local                    (DNS sobre TCP)
services:
  dns-interceptor:
    build: .
    image: dns-interceptor:latest
    container_name: dns-interceptor
    ports:
      - "${DI_PUBLISHED_PORT:-15353}:5353/udp"
      - "${DI_PUBLISHED_PORT:-15353}:5353/tcp"
    environment:
      DI_DOMAINS: ${DI_DOMAINS:-apache.p2.local,*.cdn.p2.local}
      DI_ZONE_IPS: ${DI_ZONE_IPS:-america=10.0.0.1,europa=10.0.0.2,asia=10.0.0.3}
      DI_DEFAULT_ZONE: ${DI_DEFAULT_ZONE:-america}
      DI_UPSTREAM_DNS: ${DI_UPSTREAM_DNS:-8.8.8.8}
      # Dominios verificados desde el API Node.js (vacío = solo DI_DOMAINS).
      DI_DOMAINS_URL: ${DI_DOMAINS_URL:-}
      DI_DOMAINS_TOKEN: ${DI_DOMAINS_TOKEN:-}
      # Respaldo de zonas: con las IPs de ejemplo ninguna responde y se mantiene la zona del país.
      DI_HEALTH_PORT: ${DI_HEALTH_PORT:-80}
      DI_HEALTH_INTERVAL_SECONDS: ${DI_HEALTH_INTERVAL_SECONDS:-5}
    restart: unless-stopped
