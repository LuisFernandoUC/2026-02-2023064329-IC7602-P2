name: zonal-cache

on:
  push:
    paths:
      - "zonal-cache/**"
      - "deploy/helm/zonal-cache/**"
      - ".github/workflows/zonal-cache.yml"
  pull_request:
    paths:
      - "zonal-cache/**"
      - "deploy/helm/zonal-cache/**"
      - ".github/workflows/zonal-cache.yml"

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: zonal-cache
    steps:
      - uses: actions/checkout@v4
      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libcurl4-openssl-dev libssl-dev libcjson-dev
      - name: Compilar
        run: make
      - name: Pruebas unitarias
        run: make test
      - name: Imagen Docker (incluye pruebas)
        run: docker build --target test .

  helm-chart:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: helm lint
        run: helm lint deploy/helm/zonal-cache --set config.url=http://api.example/config
      - name: helm template (API remota)
        run: helm template zc deploy/helm/zonal-cache --set config.url=http://api.example/config > /dev/null
      - name: helm template (configuración inline, sin TLS)
        run: |
          helm template zc deploy/helm/zonal-cache \
            --set tls.enabled=false \
            --set-json 'config.inline={"domains":[]}' > /dev/null
